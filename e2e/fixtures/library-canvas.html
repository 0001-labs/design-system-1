<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Library canvas</title>
<script type="module">
  // A library's workbench as a saved library opens it, without an account: the stylesheet it opens
  // with (?library=custom|box, else a new library's template), the open component (?component=),
  // the documentation's frame (?embed), another scale (?sf=) and dark (?dark), and every
  // `workbench-dirty` (each one a save) recorded in `window.dirty`.
  const query = new URLSearchParams(location.search);
  if (query.has('embed')) document.documentElement.dataset.docsEmbed = '';
  if (query.has('dark')) { document.documentElement.classList.add('dark-theme'); document.documentElement.style.colorScheme = 'dark'; }
  await import('/DS1/1-root/one.css');
  await import('/shared/site-navigation.css');
  await import('/app/src/app.css');
  await import('/app/src/docs-embed.css');
  await import('/app/src/shell.css');
  await import('/DS1/2-core/ds-icon.ts');
  const { startScaling } = await import('/DS1/0-face/scaling.ts');
  startScaling();
  const sf = query.get('sf');
  if (sf) for (const name of ['--sf', '--ds-sf']) document.documentElement.style.setProperty(name, sf);
  const { libraryTemplate } = await import('/app/src/lib/libraryTemplate.ts');
  const { defaultButtonBox, writeButtonBox } = await import('/app/src/lib/buttonBoxModel.ts');
  const libraries = {
    // Another primary fill, a rounder corner, a part rule and a plain element rule: none may reach the workbench around the specimens.
    custom: `${libraryTemplate}\n:root { --ds-button-primary-fill: rgb(255, 0, 102); --ds-corner-size: 10px; }\nds-button::part(control) { letter-spacing: 3px; }\nspan, h1, h2, h3 { color: rgb(255, 0, 102); }\n`,
    box: writeButtonBox(libraryTemplate, { ...defaultButtonBox, paddingX: 12, radius: 8 }),
  };
  await import('/app/src/SystemWorkbench.ts');
  const shell = document.createElement('div');
  shell.className = 'app-shell';
  const workbench = document.createElement('ds1-system-workbench');
  workbench.initialCss = libraries[query.get('library')];
  window.dirty = [];
  workbench.addEventListener('workbench-dirty', event => { window.dirty.push(event.detail.css); });
  shell.append(workbench);
  document.body.append(shell);
  window.ready = customElements.whenDefined('ds1-system-workbench').then(() => workbench.updateComplete);
</script></head>
<body></body></html>
