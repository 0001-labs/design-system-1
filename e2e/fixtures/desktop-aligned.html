<!doctype html><html><head><meta charset="utf-8"><title>Desktop aligned</title>
<style>
  body { margin: 0; }
  /* As high as the window under the leftover, so its bottom edge is the window's. */
  #down { position: relative; height: calc(var(--ds-grid-rows, 0) * var(--ds-grid-unit)); }
  #across { position: absolute; left: 0; top: 0; height: var(--ds-grid-unit); width: calc(var(--ds-grid-columns, 0) * var(--ds-grid-unit)); }
  #last { position: absolute; right: 0; bottom: 0; width: var(--ds-grid-unit); height: var(--ds-grid-unit); }
</style>
<script type="module">
  import '/DS1/1-root/grid.css';
  import '/DS1/0-face/grid.ts';
  import { startScaling } from '/DS1/0-face/scaling.ts';
  let stop = startScaling({ desktop: 'aligned' });
  window.align = on => { stop(); stop = startScaling(on ? { desktop: 'aligned' } : {}); };
  window.ready = Promise.resolve();
</script></head>
<body><div id="down"><div id="across"></div><div id="last"></div></div></body></html>
